<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url("fonts/Anton-Regular.ttf");}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;font-family:Anton,sans-serif;overflow:hidden;text-transform:uppercase}
.photo{position:relative;height:945px;background:url("{{ photo }}") center/cover}
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2) 0%,rgba(0,0,0,.2) 45%,rgba(0,0,0,.75) 100%)}
.text{position:absolute;left:60px;right:60px;bottom:50px;z-index:1}
.hook{color:#FFFFFF;font-size:120px;line-height:.95;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.sub{color:#FFD600;font-size:46px;margin-top:18px;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.bar{height:405px;padding:48px 60px;display:flex;flex-direction:column;justify-content:space-between}
.price{color:#FFD600;font-size:110px;line-height:1}
.yen{color:#8A8A8A;font-size:44px;margin-left:18px}
.meta{color:#FFFFFF;font-size:42px}
.foot{color:#8A8A8A;font-size:34px;display:flex;justify-content:space-between;text-transform:none}
</style></head><body>
<div class="photo"><div class="text">
  <div class="hook" id="hook">{{ hook }}</div>
  <div class="sub">{{ sub_hook }}</div>
</div></div>
<div class="bar">
  <div class="price">{{ price_usd }}<span class="yen">{{ price_yen }}</span></div>
  <div class="meta">{{ specs }}</div>
  <div class="foot"><span>{{ location }}</span><span>{{ handle }}</span></div>
</div>
<script>
// Shrink the hook until it fits on 2 lines (minimum 84px)
const h=document.getElementById('hook'); let s=120;
while(h.offsetHeight > s*0.95*2+4 && s>84){ s-=4; h.style.fontSize=s+'px'; }
</script>
</body></html>
