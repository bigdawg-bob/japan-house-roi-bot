<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url("../fonts/Serif-Light.ttf");font-weight:300}
@font-face{font-family:Sans;src:url("../fonts/Sans-Light.ttf");font-weight:300}
@font-face{font-family:Sans;src:url("../fonts/Sans-Regular.ttf");font-weight:400}
@font-face{font-family:Sans;src:url("../fonts/Sans-Medium.ttf");font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;font-family:Sans,sans-serif;font-weight:400;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal}
.photo{position:relative;height:945px;background:url("{{ photo }}") center/cover}
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2) 0%,rgba(0,0,0,.2) 45%,rgba(0,0,0,.75) 100%)}
.text{position:absolute;left:60px;right:60px;bottom:50px;z-index:1}
.hook{font-family:Serif,serif;font-weight:300;color:#FFFFFF;font-size:120px;line-height:1;
  letter-spacing:-0.02em;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.sub{color:#FFD600;font-size:34px;font-weight:400;margin-top:22px;letter-spacing:0.01em;
  text-shadow:0 2px 10px rgba(0,0,0,.6)}
.bar{height:405px;padding:48px 60px;display:flex;flex-direction:column;justify-content:space-between}
.price{font-family:Serif,serif;font-weight:300;color:#FFD600;font-size:120px;line-height:1;
  letter-spacing:-0.02em;font-variant-numeric:lining-nums}
.yen{font-family:Sans,sans-serif;font-weight:400;color:#8A8A8A;font-size:40px;margin-left:20px;letter-spacing:0}
.meta{color:#FFFFFF;font-size:36px;font-weight:400;letter-spacing:0.01em}
.foot{color:#8A8A8A;font-size:26px;font-weight:500;letter-spacing:0.08em;display:flex;justify-content:space-between}
</style></head><body>
<div class="photo"><div class="text">
  <div class="hook" id="hook">{{ hook }}</div>
  <div class="sub">{{ sub_hook }}</div>
</div></div>
<div class="bar">
  <div class="price">{{ price_usd }}<span class="yen">{{ price_yen }}</span></div>
  <div class="meta">{{ specs }}</div>
  <div class="foot"><span>{{ location }}</span><span>{{ handle }}</span></div>
</div>
<script>
// Wait for fonts, then shrink the hook until it fits on 2 lines (minimum 84px)
document.fonts.ready.then(() => {
  const h=document.getElementById('hook'); let s=120;
  while(h.offsetHeight > s*1.0*2+4 && s>84){ s-=4; h.style.fontSize=s+'px'; }
});
</script>
</body></html>
