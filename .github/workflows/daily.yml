name: Daily akiya post

on:
  schedule:
    - cron: "40 21 * * *"      # 05:40 GMT+8 start, post arrives around 06:00
    - cron: "40 23 * * *"      # 07:40 GMT+8 backup, skipped if already posted today
  workflow_dispatch:           # adds the "Run workflow" button
    inputs:
      dry_run:
        description: "Test only (make slides, don't post to Telegram)"
        type: boolean
        default: false

permissions:
  contents: write              # lets the bot save state/ back to the repo

concurrency:
  group: akiya-bot             # never run two at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ── secrets (Settings → Secrets and variables → Actions) ──
      BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
      CHAT_ID:        ${{ secrets.CHAT_ID }}
      AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}
      AIRROI_KEY:     ${{ secrets.AIRROI_KEY }}
      GROK_API_KEY:   ${{ secrets.GROK_API_KEY }}
      PEXELS_KEY:     ${{ secrets.PEXELS_KEY }}

      # ── your settings ──
      MAX_PRICE_USD:    "100000"
      MAX_DRIVE_MIN:    "45"
      MAX_WALK_MIN:     "15"
      FEE_LIMIT_PCT:    "15"
      HOOK_KINDS:       "ski,onsen,sight,beach,nature"
      MAX_AIRROI_CALLS: "15"

      # ── which sites to scrape ──
      # At Home + HOME'S block GitHub's servers (HTTP 403), so only Sumai for now.
      SOURCES:          "sumai"
      ROTATE_SOURCES:   "1"

      # ── ranking: location first, yield second ──
      HOOK_PRIORITY:    "ski=1.0,onsen=1.0,sight=0.9,beach=0.9,nature=0.8"
      YIELD_CAP_PCT:    "15"     # yield adds at most this many points (free house = cap)
      MIN_YIELD_PCT:    "0"      # skip houses whose Airbnb estimate is below this
      MAX_CHECK:        "40"     # how many top-located houses to check fees/AirROI for
      RECENT_HOOKS:     "5"      # don't repeat an attraction featured in the last N posts

      # ── listing check (updated recently, not sold / under negotiation) ──
      MAX_LISTING_AGE_DAYS: "90"
      NO_DATE_OK:       "0"      # 1 = allow listings whose page shows no update date

      # ── area slides (slides 2 & 3) ──
      GROK_MODEL:       "grok-4.6"
      PHOTO_CHECKS:     "6"      # Grok photo checks per slide (photos of the place)
      GENERIC_CHECKS:   "4"      # extra checks per slide for the generic Japan fallback
      AREA_OVERLAY:     "0.75"   # black overlay on slides 2 & 3 (0.75 = 75%)
      LIBRARY_MAX:      "60"     # photos kept in state/photo_library for reuse

      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Already posted today?
        id: guard
        run: |
          python3 - <<'EOF'
          import json, os, datetime as dt
          today = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=9)).strftime("%Y-%m-%d")
          try:
              with open("state/rotation.json", encoding="utf-8") as f:
                  last = json.load(f).get("date")
          except Exception:
              last = None
          skip = last == today and os.environ["GITHUB_EVENT_NAME"] == "schedule"
          print(f"Last post: {last} | today: {today} | skip this run: {skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          EOF

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fonts
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Install Python packages
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install requests pillow beautifulsoup4 lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the bot
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 20
        run: python -u main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload slides (for checking)
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save state (posted list + caches + photo library)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "akiya-bot"
          git config user.email "akiya-bot@users.noreply.github.com"
          mkdir -p state
          git add -A state
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Update state $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
