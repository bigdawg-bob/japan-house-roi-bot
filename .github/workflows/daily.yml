name: Daily akiya post

on:
  schedule:
    - cron: "0 13 * * *"        # 13:00 UTC = 22:00 Japan
  workflow_dispatch:
    inputs:
      test_run:
        description: "Test run (sends to Telegram but doesn't mark the house as posted)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
      IG_HANDLE: "@yourhandle"               # ← change this
      TEST_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium + Japanese fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Find deal, render slides, send to Telegram
        env:
          AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Upload slides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save state (AirROI cache + posted list)
        if: always()
        run: |
          [ -d state ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && { echo "No state changes"; exit 0; }
          git commit -m "State update $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Telegram alert on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="❌ Akiya bot failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
