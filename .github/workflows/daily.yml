name: daily

on:
  schedule:
    - cron: "0 23 * * *"   # every day at 08:00 Japan time
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write           # lets the bot save its notes to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y fonts-dejavu-core

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}
        run: python main.py

      - name: Save bot memory
        if: always()
        run: |
          mkdir -p state
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update bot memory"
          git push
