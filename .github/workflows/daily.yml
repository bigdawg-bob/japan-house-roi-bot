name: Daily akiya post

on:
  schedule:
    - cron: "0 0 * * *"        # every day at 00:00 UTC = 09:00 Japan time
  workflow_dispatch:           # adds the "Run workflow" button
    inputs:
      dry_run:
        description: "Test only (make slides, don't post to Telegram)"
        type: boolean
        default: false

permissions:
  contents: write              # lets the bot save state/ back to the repo

concurrency:
  group: akiya-bot             # never run two at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ── secrets (Settings → Secrets and variables → Actions) ──
      BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
      CHAT_ID:        ${{ secrets.CHAT_ID }}
      AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}
      AIRROI_KEY:     ${{ secrets.AIRROI_KEY }}

      # ── your settings ──
      MAX_PRICE_USD:    "100000"
      MAX_DRIVE_MIN:    "45"
      MAX_WALK_MIN:     "15"
      FEE_LIMIT_PCT:    "15"
      HOOK_KINDS:       "ski,onsen,sight,beach,nature"
      MAX_AIRROI_CALLS: "15"

      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Install Python packages
        run: |
          pip install requests pillow beautifulsoup4 lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the bot
        run: python main.py

      - name: Upload slides (for checking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save state (posted list + caches)
        if: always()
        run: |
          git config user.name  "akiya-bot"
          git config user.email "akiya-bot@users.noreply.github.com"
          mkdir -p state
          git add state
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Update state $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
